<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="853"
     height="1856"
     viewBox="0 0 853 1856"
     preserveAspectRatio="xMidYMid slice">
  <title>Nền vector trống đồng cho màn hình chấm công thành công</title>
  <desc>Vector thuần SVG, không nhúng ảnh raster.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.52" stop-color="#fbf7ee"/>
      <stop offset="1" stop-color="#f7f1e4"/>
    </linearGradient>
    <radialGradient id="jade-wash" cx="82%" cy="69%" r="80%">
      <stop offset="0" stop-color="#dce6d2" stop-opacity="0.20"/>
      <stop offset="0.58" stop-color="#e8ecdc" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <g id="bird" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-48 2 L-22-3 L-5-31 L4-7 L22-3 L52-13 L27 3 L10 8 L-6 29 L-16 8 Z"/>
      <path d="M-33 1 L-45-10 M-29 3 L-42 15 M12-2 L17 10 M18-3 L22 8"/>
      <circle cx="24" cy="-4" r="1.5" fill="currentColor" stroke="none"/>
    </g>

    <g id="deer" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-31-7 L20-9 L30 7 L-26 10 Z"/>
      <path d="M19-8 L34-29 L48-27 M34-29 L29-43 M31-38 L40-46"/>
      <circle cx="38" cy="-31" r="5"/>
      <path d="M-18 8 L-22 36 M16 7 L20 36 M-30-4 L-44-18"/>
    </g>

    <g id="person" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-22" r="5"/>
      <path d="M-5-15 L5-15 L11 10 L-11 10 Z M-5 10 L-9 30 M5 10 L10 30"/>
      <path d="M-4-11 L-18 2 M4-11 L18 2"/>
      <path d="M-4-27 L-7-39 M0-27 L0-42 M4-27 L8-39"/>
    </g>

    <g id="drummer" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <use xlink:href="#person"/>
      <circle cx="25" cy="8" r="9"/>
      <path d="M17 0 L33-10 M18 2 L31 10"/>
    </g>

    <g id="stilt-house" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-54-16 L-37-47 L37-47 L54-16 Z"/>
      <path d="M-39-15 V27 M39-15 V27 M-39 11 H39 M-45 27 H45"/>
      <path d="M-33 11 V45 M-11 11 V45 M11 11 V45 M33 11 V45"/>
      <path d="M-31-42 L-22-20 M-18-42 L-9-20 M-5-42 L4-20 M8-42 L17-20 M21-42 L30-20"/>
    </g>

    <g id="sun-ray" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round">
      <path d="M-17-73 L0-255 L17-73 Z"/>
      <path d="M-11-91 L0-210 L11-91 Z"/>
    </g>

    <g id="triangle-mark" fill="none" stroke="currentColor" stroke-width="1">
      <path d="M-7-616 L0-597 L7-616 Z"/>
    </g>
  </defs>

  <rect width="853" height="1856" fill="url(#background)"/>
  <rect width="853" height="1856" fill="url(#jade-wash)"/>

  <!-- Loang giấy vector rất nhẹ -->
  <g fill="#dce6d2" opacity="0.035">
    <circle cx="78" cy="292" r="72"/><circle cx="736" cy="312" r="90"/>
    <circle cx="286" cy="690" r="105"/><circle cx="746" cy="920" r="76"/>
    <circle cx="125" cy="1190" r="88"/><circle cx="545" cy="1510" r="112"/>
    <circle cx="294" cy="1790" r="68"/>
  </g>

  <!-- Vành trống cắt qua mép trên -->
  <g transform="translate(426 -750)" fill="none" stroke="#b98a50" stroke-opacity="0.30" stroke-width="1.2">
    <circle r="930"/><circle r="914"/><circle r="892"/><circle r="867"/><circle r="842"/>
    <circle r="900" stroke-dasharray="1 10" stroke-width="3" stroke-linecap="round"/>
    <circle r="855" stroke-dasharray="9 7"/>
  </g>
  <g color="#b98a50" opacity="0.30">
    <use xlink:href="#bird" transform="translate(126 177) rotate(-12) scale(.76)"/>
    <use xlink:href="#bird" transform="translate(692 163) rotate(192) scale(.76)"/>
  </g>

  <!-- Các vành chìm phía trái và đáy -->
  <g fill="none" stroke="#b98a50" stroke-opacity="0.17" stroke-width="1.15">
    <g transform="translate(-492 1225)">
      <circle r="870"/><circle r="850"/><circle r="826"/><circle r="800"/>
      <circle r="838" stroke-dasharray="1 10" stroke-width="3" stroke-linecap="round"/>
      <circle r="812" stroke-dasharray="8 7"/>
    </g>
    <g transform="translate(-275 1888)">
      <circle r="770"/><circle r="752"/><circle r="728"/><circle r="704"/>
      <circle r="740" stroke-dasharray="1 10" stroke-width="3" stroke-linecap="round"/>
      <circle r="716" stroke-dasharray="8 7"/>
    </g>
  </g>
  <g color="#b98a50" opacity="0.18">
    <use xlink:href="#bird" transform="translate(84 1018) rotate(58) scale(.72)"/>
    <use xlink:href="#bird" transform="translate(106 1478) rotate(18) scale(.64)"/>
  </g>

  <!-- Mặt trống chính -->
  <g transform="translate(827 1295)" color="#b98a50" fill="none" stroke="currentColor" stroke-opacity="0.34" stroke-width="1.25">
    <circle r="657"/><circle r="646"/><circle r="631"/><circle r="612"/><circle r="593"/>
    <circle r="564"/><circle r="542"/><circle r="496"/><circle r="470"/>
    <circle r="410"/><circle r="384"/><circle r="304"/><circle r="279"/>

    <circle r="622" stroke-dasharray="9 6"/>
    <circle r="575" stroke-dasharray="8 6"/>
    <circle r="552" stroke-dasharray="1 9" stroke-width="3" stroke-linecap="round"/>
    <circle r="480" stroke-dasharray="7 6"/>
    <circle r="399" stroke-dasharray="8 6"/>
    <circle r="292" stroke-dasharray="1 8" stroke-width="3" stroke-linecap="round"/>

    <!-- Hai vành tam giác, lặp bằng use để giữ file nhẹ -->
    <g opacity="0.95">
      <use xlink:href="#triangle-mark" transform="rotate(0)"/><use xlink:href="#triangle-mark" transform="rotate(15)"/>
      <use xlink:href="#triangle-mark" transform="rotate(30)"/><use xlink:href="#triangle-mark" transform="rotate(45)"/>
      <use xlink:href="#triangle-mark" transform="rotate(60)"/><use xlink:href="#triangle-mark" transform="rotate(75)"/>
      <use xlink:href="#triangle-mark" transform="rotate(90)"/><use xlink:href="#triangle-mark" transform="rotate(105)"/>
      <use xlink:href="#triangle-mark" transform="rotate(120)"/><use xlink:href="#triangle-mark" transform="rotate(135)"/>
      <use xlink:href="#triangle-mark" transform="rotate(150)"/><use xlink:href="#triangle-mark" transform="rotate(165)"/>
      <use xlink:href="#triangle-mark" transform="rotate(180)"/><use xlink:href="#triangle-mark" transform="rotate(195)"/>
      <use xlink:href="#triangle-mark" transform="rotate(210)"/><use xlink:href="#triangle-mark" transform="rotate(225)"/>
      <use xlink:href="#triangle-mark" transform="rotate(240)"/><use xlink:href="#triangle-mark" transform="rotate(255)"/>
      <use xlink:href="#triangle-mark" transform="rotate(270)"/><use xlink:href="#triangle-mark" transform="rotate(285)"/>
      <use xlink:href="#triangle-mark" transform="rotate(300)"/><use xlink:href="#triangle-mark" transform="rotate(315)"/>
      <use xlink:href="#triangle-mark" transform="rotate(330)"/><use xlink:href="#triangle-mark" transform="rotate(345)"/>
    </g>

    <!-- Vành chim mỏ dài -->
    <g stroke-opacity="1">
      <use xlink:href="#bird" transform="translate(-450 -260) rotate(120) scale(.72)"/>
      <use xlink:href="#bird" transform="translate(-260 -450) rotate(150) scale(.72)"/>
      <use xlink:href="#bird" transform="translate(0 -520) rotate(180) scale(.72)"/>
      <use xlink:href="#bird" transform="translate(260 -450) rotate(210) scale(.72)"/>
      <use xlink:href="#bird" transform="translate(450 -260) rotate(240) scale(.72)"/>
      <use xlink:href="#bird" transform="translate(520 0) rotate(270) scale(.72)"/>
      <use xlink:href="#bird" transform="translate(450 260) rotate(300) scale(.72)"/>
      <use xlink:href="#bird" transform="translate(260 450) rotate(330) scale(.72)"/>
      <use xlink:href="#bird" transform="translate(0 520) rotate(0) scale(.72)"/>
      <use xlink:href="#bird" transform="translate(-260 450) rotate(30) scale(.72)"/>
      <use xlink:href="#bird" transform="translate(-450 260) rotate(60) scale(.72)"/>
      <use xlink:href="#bird" transform="translate(-520 0) rotate(90) scale(.72)"/>
    </g>

    <!-- Vành chim và hươu xen kẽ -->
    <g stroke-opacity="1">
      <use xlink:href="#bird" transform="translate(-355 -205) rotate(120) scale(.54)"/>
      <use xlink:href="#deer" transform="translate(-205 -355) rotate(150) scale(.54)"/>
      <use xlink:href="#bird" transform="translate(0 -410) rotate(180) scale(.54)"/>
      <use xlink:href="#deer" transform="translate(205 -355) rotate(210) scale(.54)"/>
      <use xlink:href="#bird" transform="translate(355 -205) rotate(240) scale(.54)"/>
      <use xlink:href="#deer" transform="translate(410 0) rotate(270) scale(.54)"/>
      <use xlink:href="#bird" transform="translate(355 205) rotate(300) scale(.54)"/>
      <use xlink:href="#deer" transform="translate(205 355) rotate(330) scale(.54)"/>
      <use xlink:href="#bird" transform="translate(0 410) rotate(0) scale(.54)"/>
      <use xlink:href="#deer" transform="translate(-205 355) rotate(30) scale(.54)"/>
      <use xlink:href="#bird" transform="translate(-355 205) rotate(60) scale(.54)"/>
      <use xlink:href="#deer" transform="translate(-410 0) rotate(90) scale(.54)"/>
    </g>

    <!-- Nhà sàn và dải người theo bố cục mẫu -->
    <g stroke-opacity="1">
      <use xlink:href="#stilt-house" transform="translate(-205 -470) scale(1.15)"/>
      <use xlink:href="#drummer" transform="translate(-340 -400) scale(1.04)"/>
      <use xlink:href="#person" transform="translate(-280 -445) scale(1.04)"/>
      <use xlink:href="#person" transform="translate(-122 -490) scale(1.04)"/>
      <use xlink:href="#drummer" transform="translate(-55 -510) scale(1.04)"/>

      <use xlink:href="#person" transform="translate(305 430) rotate(-30) scale(1.05)"/>
      <use xlink:href="#person" transform="translate(215 485) rotate(-20) scale(1.05)"/>
      <use xlink:href="#drummer" transform="translate(112 525) rotate(-10) scale(1.05)"/>
      <use xlink:href="#person" transform="translate(0 540) scale(1.05)"/>
      <use xlink:href="#person" transform="translate(-112 525) rotate(10) scale(1.05)"/>
      <use xlink:href="#drummer" transform="translate(-215 485) rotate(20) scale(1.05)"/>
      <use xlink:href="#person" transform="translate(-305 430) rotate(30) scale(1.05)"/>
    </g>

    <!-- Mặt trời đúng 14 tia -->
    <g stroke-opacity="1">
      <use xlink:href="#sun-ray" transform="rotate(0)"/><use xlink:href="#sun-ray" transform="rotate(25.7143)"/>
      <use xlink:href="#sun-ray" transform="rotate(51.4286)"/><use xlink:href="#sun-ray" transform="rotate(77.1429)"/>
      <use xlink:href="#sun-ray" transform="rotate(102.8571)"/><use xlink:href="#sun-ray" transform="rotate(128.5714)"/>
      <use xlink:href="#sun-ray" transform="rotate(154.2857)"/><use xlink:href="#sun-ray" transform="rotate(180)"/>
      <use xlink:href="#sun-ray" transform="rotate(205.7143)"/><use xlink:href="#sun-ray" transform="rotate(231.4286)"/>
      <use xlink:href="#sun-ray" transform="rotate(257.1429)"/><use xlink:href="#sun-ray" transform="rotate(282.8571)"/>
      <use xlink:href="#sun-ray" transform="rotate(308.5714)"/><use xlink:href="#sun-ray" transform="rotate(334.2857)"/>
      <circle r="64"/><circle r="54"/>
    </g>
  </g>
</svg>
