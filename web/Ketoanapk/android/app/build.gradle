apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
// Firebase Cloud Messaging: production/staging supply app/google-services.json outside source control.
// Keeping the plugin conditional lets pull-request CI compile and test without exposing Firebase config.
def googleServicesFile = file('google-services.json')
if (googleServicesFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('google-services.json is absent; FCM runtime delivery is disabled for this build.')
    def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    if (releaseRequested && !project.hasProperty('allowMissingGoogleServices')) {
        throw new GradleException('Release requires app/google-services.json. CI validation may opt out with -PallowMissingGoogleServices=true; that artifact must not be deployed.')
    }
}

// Đọc thông tin keystore ký release từ android/keystore.properties (không commit vào git).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "com.ketoanapk.hr"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ketoanapk.hr"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 98
        versionName "1.3.22"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Địa chỉ API backend qua Cloudflare Tunnel (public, cert hợp lệ, cổng 443).
        // Đổi tại đây nếu đổi domain. Dùng cho MỌI tính năng TRỪ chấm công.
        buildConfigField "String", "API_BASE_URL", "\"https://app.ketoancp.click\""
        // Địa chỉ máy chủ chấm công trong LAN (KHÔNG qua Internet). Bắt buộc cùng mạng LAN với máy
        // chủ mới chấm được — chống gian lận "chấm từ xa" + không đẩy ảnh khuôn mặt ra ngoài Internet.
        // Cert tự ký (mkcert) cho IP này được tin qua res/xml/network_security_config.xml (raw/ketoanmini_ca).
        // Đổi IP tại đây nếu máy chủ đổi địa chỉ LAN (nhớ đổi kèm domain trong network_security_config.xml).
        buildConfigField "String", "ATTENDANCE_BASE_URL", "\"https://192.168.1.88:5443\""
        // --- TURN cho gọi thoại/video (BẮT BUỘC khi gọi khác mạng qua Internet) ---
        // Để trống nếu 2 máy LUÔN cùng mạng LAN. Nhân viên gọi nhau qua Internet (4G ↔ WiFi, sau NAT
        // đối xứng) thì STUN không xuyên được → cần TURN chuyển tiếp media (vẫn mã hóa DTLS-SRTP đầu-cuối).
        // TURN_URL: NHIỀU url cách nhau bởi dấu phẩy (udp + tcp dự phòng khi mạng chặn UDP). Xem hướng dẫn
        // dựng coturn ở deploy/coturn/. USER/PASS phải KHỚP dòng `user=` trong turnserver.conf.
        //   TURN_URL  = "turn:turn.ketoancp.click:3478?transport=udp,turn:turn.ketoancp.click:3478?transport=tcp"
        //   TURN_USER = "ketoan"   /   TURN_PASS = "<đổi-mật-khẩu-mạnh>"
        buildConfigField "String", "TURN_URL", "\"\""
        buildConfigField "String", "TURN_USER", "\"\""
        buildConfigField "String", "TURN_PASS", "\"\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Chỉ ký bằng key release khi có keystore.properties; nếu không sẽ báo lỗi khi build release.
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            // Bản phát hành chỉ mang CPU của ĐIỆN THOẠI THẬT. x86/x86_64 chỉ máy ảo mới dùng, mà nhân
            // viên lại tải APK này qua tunnel → đo 2026-07-17: bỏ hai ABI đó cắt 42,3 MB thư viện native
            // (72,7 → 30,4 MB), APK release 130 → 87,5 MB.
            //
            // Đặt ở release chứ KHÔNG ở defaultConfig, nhưng KHÔNG phải vì máy ảo hết chạy được: AVD
            // Pixel_9_Pro báo abilist "x86_64,arm64-v8a" nên bản chỉ-ARM vẫn cài & chạy (đã thử). Lý do
            // thật là TỐC ĐỘ: giữ x86_64 cho bản debug thì native chạy THẲNG trên máy ảo, không phải qua
            // lớp dịch ARM→x86 (chậm và dễ trục trặc với đống native nặng: ONNX/MediaPipe nhận diện
            // khuôn mặt, WebRTC). Debug để kiểm thử, release để nhẹ.
            //
            // Giữ armeabi-v7a cho máy 32-bit đời cũ: bỏ nó tiết kiệm thêm 11,4 MB nhưng máy 32-bit sẽ
            // KHÔNG cài nổi bản cập nhật (INSTALL_FAILED_NO_MATCHING_ABIS) — không đáng để đổi.
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
            // ĐỪNG bật minify/shrink nếu chưa viết luật giữ lớp: R8 đổi tên org.webrtc.* thì JNI_OnLoad
            // của libjingle_peerconnection_so.so không tìm ra lớp theo tên nữa và abort() — app chết ngay
            // lúc khởi động, chưa kịp vẽ gì. Đã dính đúng vậy ở bản 1.2.44-code50 (2026-07-15).
            // SignalR (reflection) và ML Kit cũng cùng loại rủi ro. Muốn bật lại thì phải thêm luật giữ
            // cho từng thư viện rồi thử bản RELEASE trên máy thật, chứ bản debug không hề bị R8 đụng nên
            // test debug không bao giờ lộ ra lỗi này.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

repositories {
    flatDir{
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // appcompat cần cho theme nền (AppTheme kế thừa Theme.AppCompat trong styles.xml).
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation 'androidx.test:core:1.6.1'
    // GrantPermissionRule cho test màn quét QR (chỉ nằm trong APK test, không vào bản phát hành).
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // --- Giao diện native Jetpack Compose + Material 3 ---
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // --- Mạng / lưu trữ ---
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // --- Realtime SignalR: đồng bộ tức thì (đơn từ…) khi app đang mở, như bản web (/hubs/changes) ---
    implementation 'com.microsoft.signalr:signalr:8.0.0'
    implementation 'org.slf4j:slf4j-nop:2.0.13' // signalr dùng SLF4J; nop = tắt log tránh cảnh báo

    // --- Thông báo nền: khay hệ thống + kiểm tra định kỳ (WorkManager) ---
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // --- Thông báo đẩy tức thì (Firebase Cloud Messaging) ---
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    // --- Camera native (CameraX) cho chấm công khuôn mặt, đăng ký khuôn mặt, chụp chân dung, quét QR.
    //     Phiên bản khai báo ở variables.gradle (cameraxVersion) để cả hệ thống dùng chung một bản. ---
    implementation "androidx.camera:camera-core:$rootProject.ext.cameraxVersion"
    implementation "androidx.camera:camera-camera2:$rootProject.ext.cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$rootProject.ext.cameraxVersion"
    implementation "androidx.camera:camera-view:$rootProject.ext.cameraxVersion"

    // --- Nhận diện khuôn mặt on-device (ML Kit, chạy offline) để căn khung 2 bước +
    //     liveness chớp mắt cho luồng chấm công kiểu sinh trắc học ngân hàng ---
    implementation 'com.google.mlkit:face-detection:16.1.7'
    // Bộ model nằm sẵn trong APK để QR vẫn quét được ngay cả khi thiết bị không có mạng/Google Play.
    // ML Kit ĐỌC toàn bộ mã QR trong app (QrLoginCaptureActivity trên CameraX).
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // zxing:core chỉ còn để SINH mã QR (phiếu chi). Thư viện zxing-android-embedded đã bỏ hẳn: cụm quét
    // Camera1 của nó không còn chỗ nào dùng, còn BarcodeEncoder thay bằng QRCodeWriter trong PayoutScreens.
    implementation 'com.google.zxing:core:3.5.4'

    // --- Gọi thoại / gọi video P2P (WebRTC). Media mã hóa bắt buộc bằng DTLS-SRTP;
    //     bắt tay (offer/answer/ICE) đi qua SignalR đã xác thực JWT. Bản io.github.webrtc-sdk
    //     là nhánh WebRTC của Google được duy trì, gói `org.webrtc`. ---
    implementation 'io.github.webrtc-sdk:android:125.6422.07'
}
