apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
// Firebase Cloud Messaging: cần file app/google-services.json tải từ Firebase Console.
apply plugin: 'com.google.gms.google-services'

// Đọc thông tin keystore ký release từ android/keystore.properties (không commit vào git).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "com.ketoanapk.hr"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ketoanapk.hr"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 26
        versionName "1.2.20"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Địa chỉ API backend qua Cloudflare Tunnel (public, cert hợp lệ, cổng 443).
        // Đổi tại đây nếu đổi domain. Dùng cho MỌI tính năng TRỪ chấm công.
        buildConfigField "String", "API_BASE_URL", "\"https://app.ketoancp.click\""
        // Địa chỉ máy chủ chấm công trong LAN (KHÔNG qua Internet). Bắt buộc cùng mạng LAN với máy
        // chủ mới chấm được — chống gian lận "chấm từ xa" + không đẩy ảnh khuôn mặt ra ngoài Internet.
        // Cert tự ký (mkcert) cho IP này được tin qua res/xml/network_security_config.xml (raw/ketoanmini_ca).
        // Đổi IP tại đây nếu máy chủ đổi địa chỉ LAN (nhớ đổi kèm domain trong network_security_config.xml).
        buildConfigField "String", "ATTENDANCE_BASE_URL", "\"https://192.168.1.88:5443\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Chỉ ký bằng key release khi có keystore.properties; nếu không sẽ báo lỗi khi build release.
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

repositories {
    flatDir{
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // appcompat cần cho theme nền (AppTheme kế thừa Theme.AppCompat trong styles.xml).
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"

    // --- Giao diện native Jetpack Compose + Material 3 ---
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // --- Mạng / lưu trữ ---
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // --- Realtime SignalR: đồng bộ tức thì (đơn từ…) khi app đang mở, như bản web (/hubs/changes) ---
    implementation 'com.microsoft.signalr:signalr:8.0.0'
    implementation 'org.slf4j:slf4j-nop:2.0.13' // signalr dùng SLF4J; nop = tắt log tránh cảnh báo

    // --- Thông báo nền: khay hệ thống + kiểm tra định kỳ (WorkManager) ---
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // --- Thông báo đẩy tức thì (Firebase Cloud Messaging) ---
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    // --- Camera native (CameraX) cho chấm công khuôn mặt ---
    implementation 'androidx.camera:camera-core:1.4.0'
    implementation 'androidx.camera:camera-camera2:1.4.0'
    implementation 'androidx.camera:camera-lifecycle:1.4.0'
    implementation 'androidx.camera:camera-view:1.4.0'

    // --- Nhận diện khuôn mặt on-device (ML Kit, chạy offline) để căn khung 2 bước +
    //     liveness chớp mắt cho luồng chấm công kiểu sinh trắc học ngân hàng ---
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
