  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
  #ketoanapk-api-intro {
    --api-dark: color-mix(in srgb, var(--foreground) 88%, var(--viz-series-2));
    --api-dark-soft: color-mix(in srgb, var(--foreground) 74%, var(--viz-series-2));
    --api-red: var(--viz-series-1);
    --api-yellow: var(--viz-series-3);
    --api-green: var(--viz-series-2);
    width: 100%;
  }

  #ketoanapk-api-intro .viz-controls {
    justify-content: center;
    margin-bottom: 12px;
  }

  #ketoanapk-api-intro .api-demo-stage {
    display: grid;
    place-items: center;
    min-height: 610px;
    overflow: hidden;
  }

  #ketoanapk-api-intro .api-phone {
    width: min(304px, calc(100% - 18px));
    aspect-ratio: 9 / 18.5;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 37px;
    background: color-mix(in srgb, var(--foreground) 92%, var(--background));
    box-shadow: 0 20px 56px color-mix(in srgb, var(--foreground) 18%, transparent);
  }

  #ketoanapk-api-intro .api-phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 29px;
    background: linear-gradient(160deg, var(--api-dark-soft), var(--api-dark));
  }

  #ketoanapk-api-intro .api-status-bar {
    position: absolute;
    z-index: 20;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 17px;
    color: var(--background);
    font-size: 12px;
    font-weight: 500;
  }

  #ketoanapk-api-intro .api-status-bar span:last-child {
    display: flex;
    gap: 7px;
  }

  #ketoanapk-api-intro .api-status-bar svg {
    width: 14px;
    height: 14px;
  }

  #ketoanapk-api-intro .api-intro-layer,
  #ketoanapk-api-intro .api-app-screen {
    position: absolute;
    inset: 0;
  }

  #ketoanapk-api-intro .api-intro-layer {
    z-index: 10;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--api-red) 16%, transparent), transparent 34%),
      linear-gradient(160deg, var(--api-dark-soft), var(--api-dark));
  }

  #ketoanapk-api-intro .api-brand-scene {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    transform: translateY(-6px);
  }

  #ketoanapk-api-intro .api-logo-svg {
    width: 248px;
    height: auto;
    overflow: visible;
  }

  #ketoanapk-api-intro .api-round-teeth,
  #ketoanapk-api-intro .api-logo-c {
    fill: var(--api-red);
  }

  #ketoanapk-api-intro .api-round-hole {
    fill: var(--api-dark);
  }

  #ketoanapk-api-intro .api-round-spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: api-wait-spin 900ms linear infinite;
  }

  #ketoanapk-api-intro .api-round-home {
    transform-origin: 500px 333px;
  }

  #ketoanapk-api-intro .api-triangle-fill {
    fill: var(--api-yellow);
    opacity: 0;
  }

  #ketoanapk-api-intro .api-triangle-line {
    fill: none;
    stroke: var(--api-red);
    stroke-width: 22;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 2080;
    stroke-dashoffset: 2080;
  }

  #ketoanapk-api-intro .api-logo-c {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(.8);
  }

  #ketoanapk-api-intro .api-letter-p {
    fill: var(--api-dark);
    font-family: &quot;Times New Roman&quot;, serif;
    font-size: 300px;
    font-weight: 500;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transform: translateY(18px) scale(.9);
  }

  #ketoanapk-api-intro .api-banner {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transform: scaleX(.15);
  }

  #ketoanapk-api-intro .api-banner rect {
    fill: var(--api-yellow);
  }

  #ketoanapk-api-intro .api-banner text {
    fill: var(--api-red);
    font-family: Arial, sans-serif;
    font-size: 53px;
    font-weight: 500;
    letter-spacing: 7px;
    text-anchor: middle;
  }

  #ketoanapk-api-intro .api-tagline {
    margin-top: 14px;
    color: color-mix(in srgb, var(--background) 72%, transparent);
    font-size: 12px;
    opacity: 0;
    transform: translateY(8px);
  }

  #ketoanapk-api-intro .api-tagline span {
    padding: 0 3px;
    color: var(--api-red);
  }

  #ketoanapk-api-intro .api-app-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 78px 20px 26px;
    color: var(--background);
    opacity: 0;
    transform: scale(1.03);
    background:
      radial-gradient(circle at 50% 14%, color-mix(in srgb, var(--api-red) 24%, transparent), transparent 30%),
      linear-gradient(160deg, var(--api-dark-soft), var(--api-dark));
  }

  #ketoanapk-api-intro .api-app-glow {
    position: absolute;
    top: 42px;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--api-red) 12%, transparent);
    filter: blur(18px);
  }

  #ketoanapk-api-intro .api-app-mark {
    position: relative;
    display: grid;
    place-items: center;
    width: 64px;
    height: 64px;
    border-radius: 20px;
    color: var(--api-dark);
    background: var(--background);
    font-weight: 500;
  }

  #ketoanapk-api-intro .api-app-title {
    position: relative;
    margin-top: 18px;
    font-size: 22px;
    font-weight: 500;
  }

  #ketoanapk-api-intro .api-app-copy {
    position: relative;
    margin-top: 5px;
    color: color-mix(in srgb, var(--background) 70%, transparent);
    font-size: 12px;
  }

  #ketoanapk-api-intro .api-login-box {
    position: relative;
    width: 100%;
    margin-top: 31px;
    padding: 17px;
    border: 1px solid color-mix(in srgb, var(--background) 14%, transparent);
    border-radius: 21px;
    background: color-mix(in srgb, var(--background) 8%, transparent);
  }

  #ketoanapk-api-intro .api-login-box div {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 46px;
    padding: 0 13px;
    margin-bottom: 11px;
    border: 1px solid color-mix(in srgb, var(--background) 16%, transparent);
    border-radius: 13px;
    color: color-mix(in srgb, var(--background) 62%, transparent);
    font-size: 12px;
  }

  #ketoanapk-api-intro .api-login-box strong {
    display: grid;
    place-items: center;
    height: 46px;
    border-radius: 13px;
    color: var(--background);
    background: var(--api-red);
    font-size: 13px;
    font-weight: 500;
  }

  #ketoanapk-api-intro .api-phone.is-connected .api-round-home {
    animation: api-gear-home 650ms cubic-bezier(.16,1,.3,1) forwards;
  }

  #ketoanapk-api-intro .api-phone.is-connected .api-logo-c {
    animation: api-c-lock 260ms 520ms ease-out forwards;
  }

  #ketoanapk-api-intro .api-phone.is-connected .api-triangle-line {
    animation: api-trace-logo 720ms 650ms cubic-bezier(.16,1,.3,1) forwards;
  }

  #ketoanapk-api-intro .api-phone.is-connected .api-triangle-fill {
    animation: api-show-fill 320ms 1.12s ease-out forwards;
  }

  #ketoanapk-api-intro .api-phone.is-connected .api-letter-p {
    animation: api-show-p 360ms 1.08s cubic-bezier(.16,1,.3,1) forwards;
  }

  #ketoanapk-api-intro .api-phone.is-connected .api-banner {
    animation: api-show-banner 420ms 1.38s cubic-bezier(.16,1,.3,1) forwards;
  }

  #ketoanapk-api-intro .api-phone.is-connected .api-tagline {
    animation: api-show-copy 320ms 1.72s cubic-bezier(.16,1,.3,1) forwards;
  }

  #ketoanapk-api-intro .api-phone.is-connected .api-intro-layer {
    animation: api-intro-away 360ms 2.52s ease-in forwards;
  }

  #ketoanapk-api-intro .api-phone.is-connected .api-brand-scene {
    animation: api-scene-away 360ms 2.48s cubic-bezier(.4,0,1,1) forwards;
  }

  #ketoanapk-api-intro .api-phone.is-connected .api-app-screen {
    animation: api-app-in 460ms 2.45s cubic-bezier(.16,1,.3,1) forwards;
  }

  @keyframes api-wait-spin { to { transform: rotate(360deg); } }
  @keyframes api-gear-home {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    72% { opacity: 1; transform: translate(-62px,0) scale(.76); }
    100% { opacity: 0; transform: translate(-62px,0) scale(.72); }
  }
  @keyframes api-c-lock {
    from { opacity: 0; transform: scale(.8); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes api-trace-logo { to { stroke-dashoffset: 0; } }
  @keyframes api-show-fill { to { opacity: .92; } }
  @keyframes api-show-p { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes api-show-banner { to { opacity: 1; transform: scaleX(1); } }
  @keyframes api-show-copy { to { opacity: 1; transform: translateY(0); } }
  @keyframes api-scene-away { to { opacity: 0; transform: translateY(-26px) scale(.92); } }
  @keyframes api-intro-away { to { opacity: 0; visibility: hidden; } }
  @keyframes api-app-in { to { opacity: 1; transform: scale(1); } }

  @media (max-width: 420px) {
    #ketoanapk-api-intro .api-demo-stage { min-height: 560px; }
    #ketoanapk-api-intro .api-phone { width: min(278px, calc(100% - 12px)); }
    #ketoanapk-api-intro .api-logo-svg { width: 226px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #ketoanapk-api-intro .api-round-spin { animation-duration: 1800ms; }
    #ketoanapk-api-intro .api-phone.is-connected * { animation-duration: 1ms !important; }
  }
&lt;/style&gt;

    const action = root.querySelector(&#x27;#api-intro-action&#x27;);
    let completed = false;

    const clearTimers = () =&gt; {

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
