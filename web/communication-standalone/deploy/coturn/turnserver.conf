# =============================================================================
#  coturn – TURN/STUN server cho gọi thoại/video của app KetoanAPK (WebRTC)
#  Chỉ CHUYỂN TIẾP gói media đã mã hóa DTLS-SRTP giữa 2 máy khác mạng — server
#  KHÔNG giải mã được nội dung cuộc gọi. Chỉ cần bật khi nhân viên gọi nhau
#  qua Internet (4G ↔ WiFi). Xem README.md cùng thư mục để cài đặt.
# =============================================================================

# --- Cổng lắng nghe ---------------------------------------------------------
listening-port=3478
# Bật dòng dưới nếu dùng TLS (khuyến nghị, cần chứng chỉ – xem phần TLS bên dưới):
#tls-listening-port=5349

# --- Địa chỉ IP -------------------------------------------------------------
# Bind mọi card mạng. KHÔNG cần khai listening-ip nếu server chỉ có 1 IP.
# external-ip: BẮT BUỘC nếu server nằm SAU NAT (máy công ty + forward cổng ở router).
#   • VPS có IP công cộng trực tiếp: chỉ cần   external-ip=<IP_CÔNG_CỘNG>
#   • Sau NAT:                                  external-ip=<IP_CÔNG_CỘNG>/<IP_NỘI_BỘ_LAN>
external-ip=THAY_IP_CONG_CONG_CUA_BAN

# --- Dải cổng relay (mở đúng dải này trên tường lửa) ------------------------
min-port=49160
max-port=49200

# --- Xác thực: TURN REST (shared secret) — AN TOÀN NHẤT --------------------
# KHÔNG nhúng mật khẩu vào APK. Backend (endpoint /api/chat/call/turn) cấp credential CÓ HẠN GIỜ
# ký HMAC-SHA1 bằng chính secret dưới đây. Lộ credential ra ngoài cũng vô dụng sau khi hết hạn.
use-auth-secret
realm=turn.ketoancp.click
# Tạo secret mạnh:  openssl rand -hex 32
# Rồi điền CHÍNH secret này vào backend appsettings.Local.json → "Turn": { "Secret": "..." }
static-auth-secret=THAY_SECRET_HMAC_NGAU_NHIEN_openssl_rand_hex_32

# --- Bảo mật / chống lạm dụng ----------------------------------------------
fingerprint
no-multicast-peers
stale-nonce=600
# Hạn mức tránh 1 người chiếm băng thông (tùy chọn, có thể nới):
user-quota=12
total-quota=1200
# Không mở giao diện CLI quản trị telnet (đỡ lộ):
no-cli
# CHẶN TURN chuyển tiếp vào mạng nội bộ / địa chỉ riêng (chống bị lợi dụng quét mạng LAN, SSRF):
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- TLS (tùy chọn – khuyến nghị nếu mạng khách chặn cổng lạ) ---------------
# Dùng chứng chỉ Let's Encrypt cho subdomain turn.ketoancp.click rồi bỏ chú thích:
#cert=/etc/letsencrypt/live/turn.ketoancp.click/fullchain.pem
#pkey=/etc/letsencrypt/live/turn.ketoancp.click/privkey.pem

# --- Log --------------------------------------------------------------------
log-file=/var/log/turnserver/turnserver.log
simple-log

