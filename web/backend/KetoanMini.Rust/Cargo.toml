[package]
name = "ketoanmini-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
anyhow = "1.0"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["http1", "http2", "json", "tokio"] }
base64 = "0.23.0"
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18.2"
getrandom = "0.4.3"
http = "1.5"
hyper = { version = "1.11", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
pbkdf2 = { version = "0.13.0", features = ["sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "macros", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["catch-panic", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
