# Build the KetoanMini WPF/WinForms desktop app (.NET 8, Windows-only).
# Builds the Debug configuration on every push / PR to main, and on manual run.
name: Build KetoanMini (Debug)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:        # cho phép bấm "Run workflow" thủ công

jobs:
  build:
    # Bắt buộc Windows vì project dùng WinForms/WPF (TargetFramework net8.0-windows).
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # config/database.json và data/ThongtinKH.xlsx bị .gitignore (config thật + dữ liệu
      # cục bộ) nhưng .csproj khai báo copy chúng vào output. Nếu thiếu, build sẽ lỗi
      # MSB3030 "could not copy ... not found", nên tạo file thay thế vô hại trước khi build.
      - name: Prepare gitignored local files
        shell: pwsh
        run: |
          $cfg = "src/KetoanMini/config/database.json"
          if (-not (Test-Path $cfg)) {
            Copy-Item "src/KetoanMini/config/database.lan.example.json" $cfg
          }
          $xlsx = "src/KetoanMini/data/ThongtinKH.xlsx"
          if (-not (Test-Path $xlsx)) {
            New-Item -ItemType File -Path $xlsx -Force | Out-Null
          }

      - name: Restore
        run: dotnet restore src/KetoanMini/KetoanMini.csproj

      - name: Build (Debug)
        run: dotnet build src/KetoanMini/KetoanMini.csproj -c Debug --no-restore

      # Tải bản build về tab Actions > Artifacts (chứa file ví dụ, KHÔNG có config thật).
      - name: Upload Debug build
        uses: actions/upload-artifact@v4
        with:
          name: KetoanMini-Debug
          path: src/KetoanMini/bin/Debug/net8.0-windows/
          if-no-files-found: error
