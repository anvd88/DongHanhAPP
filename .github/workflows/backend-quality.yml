name: Backend quality gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-contract-migration-backup:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ketoanmini
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ConnectionStrings__KetoanMini: "Host=localhost;Port=5432;Database=ketoanmini;Username=postgres;Password=postgres;Timezone=UTC"
      Jwt__Key: "ci-only-integration-test-signing-key-0123456789abcdef"
      Bootstrap__AdminUsername: "ci-admin"
      Bootstrap__AdminPassword: "ci-admin-password-not-a-real-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore web/backend/KetoanMini.Api.Tests/KetoanMini.Api.Tests.csproj
      - name: Build with warnings as errors
        run: dotnet build web/backend/KetoanMini.Api.Tests/KetoanMini.Api.Tests.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true
      - name: Integration, authorization, OpenAPI and migration tests
        run: dotnet test web/backend/KetoanMini.Api.Tests/KetoanMini.Api.Tests.csproj -c Release --no-build --logger "trx;LogFileName=backend.trx"
      - name: Backup and restore drill
        shell: pwsh
        run: |
          createdb -h localhost -U postgres ketoanmini_restore_test
          ./web/deploy/database/backup.ps1 -HostName localhost -Database ketoanmini_test -Username postgres -Password postgres -OutputDirectory "$env:RUNNER_TEMP/backups"
          $dump = Get-ChildItem "$env:RUNNER_TEMP/backups/*.dump" | Select-Object -First 1
          ./web/deploy/database/restore.ps1 -HostName localhost -Database ketoanmini_restore_test -Username postgres -Password postgres -BackupFile $dump.FullName
          $version = psql -h localhost -U postgres -d ketoanmini_restore_test -Atc "SELECT version FROM schema_migrations WHERE version='001_baseline'"
          if ($version -ne '001_baseline') { throw 'Restored migration history is invalid' }
        env:
          PGPASSWORD: postgres
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: web/backend/KetoanMini.Api.Tests/TestResults/*.trx
