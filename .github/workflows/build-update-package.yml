name: Build Update Package (ZIP)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override, for example 1.2.3"
        required: false
        type: string

permissions:
  contents: write

env:
  PROJECT_PATH: src/KetoanMini/KetoanMini.csproj
  UPDATE_PUBLISH_DIR: ${{ github.workspace }}\publish\update-win-x64
  UPDATE_DIR: ${{ github.workspace }}\artifacts\update

jobs:
  build-update-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare gitignored local files
        shell: pwsh
        run: |
          $cfg = "src/KetoanMini/config/database.json"
          if (-not (Test-Path $cfg)) {
            Copy-Item "src/KetoanMini/config/database.lan.example.json" $cfg
          }

          $xlsx = "src/KetoanMini/data/ThongtinKH.xlsx"
          if (-not (Test-Path $xlsx)) {
            New-Item -ItemType File -Path $xlsx -Force | Out-Null
          }

      - name: Resolve version
        shell: pwsh
        run: |
          [xml]$project = Get-Content $env:PROJECT_PATH
          $projectVersion = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($projectVersion)) {
            $projectVersion = "1.0.0"
          }

          $inputVersion = "${{ github.event.inputs.version }}"
          $tagVersion = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          }

          $version = $projectVersion
          if (-not [string]::IsNullOrWhiteSpace($tagVersion)) {
            $version = $tagVersion
          }
          if (-not [string]::IsNullOrWhiteSpace($inputVersion)) {
            $version = $inputVersion.Trim()
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use x.y.z format. Current value: $version"
          }

          $assemblyVersion = "$version.0"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "ASSEMBLY_VERSION=$assemblyVersion" >> $env:GITHUB_ENV
          "Update package version: $version" >> $env:GITHUB_STEP_SUMMARY

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }} -r win-x64

      - name: Publish app for zip update package
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:EnableCompressionInSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:PublishReadyToRun=false `
            /p:Version=$env:APP_VERSION `
            /p:AssemblyVersion=$env:ASSEMBLY_VERSION `
            /p:FileVersion=$env:ASSEMBLY_VERSION `
            --no-restore `
            -o $env:UPDATE_PUBLISH_DIR

          Remove-Item "$env:UPDATE_PUBLISH_DIR\database.json" -ErrorAction SilentlyContinue
          Remove-Item "$env:UPDATE_PUBLISH_DIR\config\database.json" -ErrorAction SilentlyContinue

      - name: Build zip update package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:UPDATE_DIR | Out-Null
          $zip = Join-Path $env:UPDATE_DIR "KetoanMiniUpdate-$env:APP_VERSION-win-x64.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          $items = Get-ChildItem -Path $env:UPDATE_PUBLISH_DIR -Force
          Compress-Archive -Path ($items | ForEach-Object { $_.FullName }) -DestinationPath $zip -CompressionLevel Optimal
          "Update package: $zip" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload zip update artifact
        uses: actions/upload-artifact@v4
        with:
          name: KetoanMiniUpdate-${{ env.APP_VERSION }}-win-x64
          path: artifacts/update/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Attach update package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-ChildItem $env:UPDATE_DIR -Filter "*.zip" | Select-Object -First 1
          if ($null -eq $package) {
            throw "Update package file not found."
          }

          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" $package.FullName --clobber
          }
          else {
            gh release create "${{ github.ref_name }}" $package.FullName `
              --title "KetoanMini $env:APP_VERSION" `
              --notes "Zip update package generated by GitHub Actions."
          }
